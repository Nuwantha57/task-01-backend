# Application Name
spring.application.name=staff-auth

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=nuwantha123@
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# AWS Cognito Configuration (Resource Server - for JWT validation)
# ========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.eu-north-1.amazonaws.com/eu-north-1_ExI0Aq7Ov
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cognito-idp.eu-north-1.amazonaws.com/eu-north-1_ExI0Aq7Ov/.well-known/jwks.json

# ========================================
# AWS Cognito Client Configuration (for OAuth2 Login - OPTIONAL for web)
# ========================================
spring.security.oauth2.client.registration.cognito.client-id=65ggmh18gfb0rp0878jrtk9rjg
spring.security.oauth2.client.registration.cognito.client-secret=c0jhldbf269g7k5qlnj0iur2uescau8h5vdck6la6s4amdpo6vb
spring.security.oauth2.client.registration.cognito.scope=email,openid,profile
spring.security.oauth2.client.registration.cognito.redirect-uri=http://localhost:3000/callback

spring.security.oauth2.client.provider.cognito.issuer-uri=https://cognito-idp.eu-north-1.amazonaws.com/eu-north-1_ExI0Aq7Ov
spring.security.oauth2.client.provider.cognito.user-name-attribute=username

# ========================================
# AWS Cognito SDK Configuration (for Sign Up / Sign In APIs)
# ========================================
aws.cognito.userPoolId=eu-north-1_9YOLgq7JV
aws.cognito.clientId=1uc9hb0f99n97k1ck45o5922hd
aws.cognito.clientSecret=
aws.cognito.region=eu-north-1

# NEW: Add User Pool Domain (needed for token endpoint)
aws.cognito.domain=eu-north-1exi0aq7ov.auth.eu-north-1.amazoncognito.com
aws.cognito.tokenEndpoint=https://eu-north-1exi0aq7ov.auth.eu-north-1.amazoncognito.com/oauth2/token

# NEW: Redirect URI (for mobile app - not strictly needed for API-only auth)
aws.cognito.redirectUri=http://localhost:3000/callback

# ========================================
# CORS Configuration (IMPORTANT for Android app)
# ========================================
# Allow your Android app to make requests
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ========================================
# Security Configuration
# ========================================
# Permit auth endpoints without authentication
security.permit-all-paths=/api/auth/**,/actuator/health

# ========================================
# AWS SES/SNS (Email/SMS configuration - OPTIONAL)
# ========================================
spring.mail.host=email-smtp.eu-north-1.amazonaws.com
spring.mail.port=587
spring.mail.username=your_ses_access_key
spring.mail.password=your_ses_secret_key
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
aws.sns.region=eu-north-1

# ========================================
# Logging Configuration
# ========================================
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.amazonaws=DEBUG
logging.level.com.example=DEBUG

# Log SQL queries (already enabled)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# Jackson Configuration (JSON serialization)
# ========================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ========================================
# Actuator (Health Check Endpoint - OPTIONAL)
# ========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Enable debug logging
logging.level.org.eyepax.staffauth=DEBUG
logging.level.software.amazon.awssdk=DEBUG
logging.level.org.springframework.web=DEBUG
